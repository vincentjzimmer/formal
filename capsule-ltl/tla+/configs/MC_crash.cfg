\* Power-fail regime: CRASH enabled. Expected findings:
\*   - SafetyAuthentic, ResetFirst, ApplyGuarded  : still HOLD (safety survives)
\*   - AntiRollbackStep : may FAIL if you model a partial write as a *lower*
\*       version; with {fwVersion, capsuleVersion} it holds, but flip the Crash
\*       action to allow an arbitrary lower value to see R1 break.
\*   - Responsiveness   : FAILS -- a crash can fire forever, starving Apply.
\*       This is the headline result: fairness-freedom was an artifact of the
\*       Lean model's determinism. Recovering L needs a bounded-retry / no-
\*       infinite-crash fairness assumption.
\* Run:  tlc -config MC_crash.cfg CapsuleUpdate.tla
CONSTANTS
    MaxVersion = 3
    CRASH = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SafetyAuthentic
INVARIANT ResetFirst

PROPERTY AntiRollbackStep
PROPERTY ApplyGuarded
PROPERTY Responsiveness
