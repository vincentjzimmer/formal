\* Two FMP devices with a CYCLIC dependency: applying to nic requires ec >= 1,
\* and applying to ec requires nic >= 1. From an all-zero start neither can go
\* first. Expected finding: SafetyAuthentic / AntiRollbackStep / ApplyGuarded
\* hold, and `Responsiveness` (reaches a terminal verdict) holds -- but
\* `ResponsivenessApply` FAILS: a perfectly authentic, strictly-newer capsule
\* is stranded forever by the dependency cycle. No crash, no unfairness in any
\* single action -- the hazard is structural, invisible to the scalar Lean model.
\* Run:  tlc -config MC_multidevice.cfg CapsuleMultiDevice.tla
CONSTANTS
    Devices = { "nic", "ec" }
    MaxVersion = 2
    Dep <- DepCyclic

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SafetyAuthentic

PROPERTY AntiRollbackStep
PROPERTY ApplyGuarded
PROPERTY Responsiveness
PROPERTY ResponsivenessApply
