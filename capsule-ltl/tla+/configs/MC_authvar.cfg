\* Baseline + replay regime for authenticated variables. With REPLAY enabled the
\* environment can re-stage the current stored timestamp under a valid signature;
\* the anti-replay guard (storedTime < reqTime) must still refuse it, so
\* Authentic / AntiReplay / WriteGuard all hold. Run:
\*   tlc -config MC_authvar.cfg AuthVar.tla
CONSTANTS
    MaxTime = 3
    REPLAY = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Authentic
PROPERTY AntiReplay
PROPERTY WriteGuard
